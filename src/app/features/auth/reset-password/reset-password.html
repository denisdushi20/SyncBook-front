<div class="auth-page">
  <div class="auth-card auth-card--wide">
    <h1>Reset Password</h1>
    <p class="subtitle">Enter the verification code and your new password.</p>

    @if (infoMessage()) {
      <p class="success">{{ infoMessage() }}</p>
    }
    @if (errorMessage()) {
      <p class="error">{{ errorMessage() }}</p>
    }

    @if (email()) {
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="field field--otp">
          <label>Verification code</label>
          <app-otp-input formControlName="code" />
        </div>

        <div class="field">
          <label for="newPassword">New password</label>
          <app-password-input formControlName="newPassword" inputId="newPassword" />
        </div>

        <div class="field">
          <label for="confirmPassword">Confirm password</label>
          <app-password-input formControlName="confirmPassword" inputId="confirmPassword" />
          @if (form.errors?.['mismatch'] && form.touched) {
            <span class="field-error">Passwords do not match.</span>
          }
        </div>

        <button type="submit" class="submit-btn" [disabled]="isSubmitting()">
          {{ isSubmitting() ? 'Saving…' : 'Reset password' }}
        </button>
      </form>

      <p class="footer-link">
        Didn't get a code?
        <button type="button" class="link-btn" (click)="resendCode()" [disabled]="isResending()">
          {{ isResending() ? 'Sending…' : 'Resend code' }}
        </button>
      </p>
    }

    <p class="footer-link">
      <a routerLink="/login">Back to sign in</a>
    </p>
  </div>
</div>
