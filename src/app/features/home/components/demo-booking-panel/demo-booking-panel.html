<form [formGroup]="form" (ngSubmit)="onSubmit()" class="demo-form">
  <div class="demo-field">
    <label class="mock-label" for="demo-business">Business</label>
    <select id="demo-business" formControlName="businessId" class="mock-select mock-select--active">
      @for (business of businesses; track business.id) {
        <option [value]="business.id">{{ business.name }}</option>
      }
    </select>
  </div>

  <div class="demo-field">
    <label class="mock-label" for="demo-service">Service</label>
    <select id="demo-service" formControlName="serviceId" class="mock-select">
      <option value="" disabled>Select a service</option>
      @for (service of servicesForSelectedBusiness(); track service.id) {
        <option [value]="service.id">{{ service.name }}</option>
      }
    </select>
  </div>

  <div class="demo-field">
    <label class="mock-label" for="demo-name">Your name</label>
    <input
      id="demo-name"
      type="text"
      formControlName="customerName"
      class="mock-select"
      placeholder="Jane Doe"
    />
  </div>

  @if (form.controls.serviceId.value) {
    <div class="demo-field">
      <label class="mock-label">Available slots</label>
      <div class="mock-slots">
        @for (slot of availableSlots(); track slot) {
          <button
            type="button"
            class="mock-slot"
            [class.mock-slot--active]="selectedSlot() === slot"
            (click)="selectSlot(slot)"
          >
            {{ slot }}
          </button>
        }
      </div>
    </div>
  }

  @if (successMessage()) {
    <div class="demo-success" role="status">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
        <path d="M22 4 12 14.01l-3-3" />
      </svg>
      {{ successMessage() }}
    </div>
  }

  <button
    type="submit"
    class="mock-btn"
    [disabled]="!selectedSlot() || form.invalid"
  >
    Book appointment
  </button>
</form>
