<div class="dashboard-shell">
  <aside class="sidebar">
    <a routerLink="/" class="sidebar-brand">SyncBook</a>

    <nav class="sidebar-nav">
      <a
        routerLink="/dashboard"
        routerLinkActive="sidebar-link--active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="sidebar-link"
      >
        Dashboard
      </a>
      <a
        routerLink="/dashboard/calendar"
        routerLinkActive="sidebar-link--active"
        class="sidebar-link"
      >
        Calendar
      </a>
      <a
        routerLink="/dashboard/profile"
        routerLinkActive="sidebar-link--active"
        class="sidebar-link"
      >
        Business Profile
      </a>
      <a
        routerLink="/dashboard/staff"
        routerLinkActive="sidebar-link--active"
        class="sidebar-link"
      >
        Staff
      </a>
      <a
        routerLink="/dashboard/settings"
        routerLinkActive="sidebar-link--active"
        class="sidebar-link"
      >
        Settings
      </a>
    </nav>

    @if (authService.currentUser$ | async; as user) {
      <div class="sidebar-footer">
        <a routerLink="/dashboard/settings" class="user-greeting user-greeting--link">{{ user.fullName }}</a>
        <button type="button" class="logout-btn" (click)="authService.logout()">Logout</button>
      </div>
    }
  </aside>

  <main class="dashboard-main">
    <router-outlet />
  </main>
</div>
