<div class="dashboard-shell">
  <aside class="sidebar">
    <a routerLink="/" class="sidebar-brand">SyncBook</a>

    <nav class="sidebar-nav">
      <a
        routerLink="/dashboard"
        routerLinkActive="sidebar-link--active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="sidebar-link"
      >
        Dashboard
      </a>
      <a
        routerLink="/dashboard/calendar"
        routerLinkActive="sidebar-link--active"
        class="sidebar-link"
      >
        Calendar
        @if ((bookingAlertsHub.newBookingCount$ | async) ?? 0; as count) {
          @if (count > 0) {
            <span class="sidebar-badge">{{ count }}</span>
          }
        }
      </a>
      <a
        routerLink="/dashboard/analytics"
        routerLinkActive="sidebar-link--active"
        class="sidebar-link"
      >
        <svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M3 13h2v8H3v-8zm4-6h2v14H7V7zm4 4h2v10h-2V11zm4-6h2v16h-2V5zm4 10h2v6h-2v-6z"
            fill="currentColor"
          />
        </svg>
        Insights &amp; Revenue
      </a>
      <a
        routerLink="/dashboard/profile"
        routerLinkActive="sidebar-link--active"
        class="sidebar-link"
      >
        Business Profile
      </a>
      <a
        routerLink="/dashboard/staff"
        routerLinkActive="sidebar-link--active"
        class="sidebar-link"
      >
        Team
      </a>
      <a
        routerLink="/dashboard/settings"
        routerLinkActive="sidebar-link--active"
        class="sidebar-link"
      >
        Settings
      </a>
    </nav>

    @if (authService.currentUser$ | async; as user) {
      <div class="sidebar-footer">
        <a routerLink="/dashboard/settings" class="user-greeting user-greeting--link">{{ user.fullName }}</a>
        <button type="button" class="logout-btn" (click)="authService.logout()">Logout</button>
      </div>
    }
  </aside>

  <main class="dashboard-main">
    <router-outlet />
  </main>
</div>
